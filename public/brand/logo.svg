<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 150" width="200" height="150" role="img" aria-label="BLF Lab's">
  <title>BLF Lab's</title>
  <!--
    Logo BLF Lab's, version pour fond clair.

    "BLF" est decoupe dans le pave par fill-rule="evenodd" : c'est le fond reel
    qui transparait, quel qu'il soit. Dans "LAB'S", la lettre A est remplacee par
    une fiole d'Erlenmeyer dont le niveau de liquide fait la barre du A.

    Aucune lettre n'est du texte : tout est en geometrie, donc le fichier se
    rend a l'identique sans aucune police installee.

    Couleurs : encre #0d1117, accent turquoise #0d7d72 (liquide et apostrophe).
    Pour un fond sombre, utiliser logo-inverse.svg.
  -->

  <path fill-rule="evenodd" fill="#0d1117" d="
    M12 0H188A12 12 0 0 1 200 12V80A12 12 0 0 1 188 92H12A12 12 0 0 1 0 80V12A12 12 0 0 1 12 0Z
    M44 24H53V68H44Z
    M53 24H77V33H53Z
    M53 42H73V51H53Z
    M53 59H77V68H53Z
    M68 33H77V42H68Z
    M68 51H77V59H68Z
    M88 24H97V68H88Z
    M97 59H114V68H97Z
    M125 24H134V68H125Z
    M134 24H156V33H134Z
    M134 42H149V51H134Z
  "/>

  <!-- L -->
  <path fill="#0d1117" d="M48 108H54V138H48ZM54 132H64V138H54Z"/>

  <!-- A remplace par la fiole : col, puis corps triangulaire evide -->
  <path fill-rule="evenodd" fill="#0d1117" d="
    M80 108H86V113H80Z
    M83 111L94 138H72Z
    M83 122L88.5 133H77.5Z
  "/>
  <!-- Niveau de liquide : il fait la barre du A -->
  <path fill="#0d7d72" d="M76.5 128H89.5L91.6 133H74.4Z"/>

  <!-- B -->
  <path fill="#0d1117" d="M102 108H108V138H102ZM108 108H120V114H108ZM108 120H118V126H108ZM108 132H120V138H108ZM114 114H120V120H114ZM114 126H120V132H114Z"/>

  <!-- Apostrophe -->
  <path fill="#0d7d72" d="M124 108H130V121H124Z"/>

  <!-- S -->
  <path fill="#0d1117" d="M134 108H152V114H134ZM134 114H140V120H134ZM134 120H152V126H134ZM146 126H152V132H146ZM134 132H152V138H134Z"/>
</svg>
